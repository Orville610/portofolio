<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Dark Terminal Rounded Background -->
  <rect width="100" height="100" rx="22" fill="#0f0f11"/>
  
  <!-- RV Prompt Monogram -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Prompt symbol > in True Netflix Red -->
    <path d="M 22 33 L 38 49 L 22 65" stroke="#e50914" stroke-width="9"/>
    
    <!-- Letter R -->
    <path d="M 48 35 L 48 65" stroke="#e50914" stroke-width="9"/>
    <path d="M 48 35 H 60 C 66 35 66 47 60 47 H 48" stroke="#e50914" stroke-width="9"/>
    <path d="M 57 47 L 64 65" stroke="#e50914" stroke-width="9"/>
    
    <!-- Letter V in Vibrant Orange-Red -->
    <path d="M 69 35 L 76 65 L 83 35" stroke="#ff453a" stroke-width="9"/>
    
    <!-- Cursor _ under the V -->
    <path d="M 76 73 H 88" stroke="#e50914" stroke-width="9"/>
  </g>
</svg>
